<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ich liebe dich, Jolanda!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(120deg, #f6d365, #fda085, #fbc2eb, #a6c1ee);
            background-size: 300% 300%;
            animation: backgroundShift 10s ease infinite;
            font-family: 'Poppins', sans-serif;
        }

        @keyframes backgroundShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            position: absolute;
            /* flexible Schriftgröße */
            font-size: clamp(1.5rem, 8vw, 3.5rem);
            color: white;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.7);
            animation: pulse 2s infinite;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), rgba(255,0,0,0.6), rgba(255,255,255,0.8));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            transition: text-shadow 0.3s ease;
            text-align: center;
            padding: 0 1rem;
        }

        h1:hover {
            text-shadow: 2px 2px 15px rgba(255, 255, 255, 1);
        }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            transform: rotate(-45deg);
            animation: float 3s ease-in-out forwards;
            filter: drop-shadow(0px 0px 8px rgba(255, 0, 0, 0.5));
            opacity: 0.9;
        }

        .heart:before,
        .heart:after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50%;
        }

        .heart:before {
            top: -10px;
            left: 0;
        }

        .heart:after {
            left: 10px;
            top: 0;
        }

        @keyframes float {
            0%   { transform: translateY(0) scale(1) rotate(-45deg); opacity: 0.9; }
            50%  { transform: translateY(-120px) scale(1.3) rotate(-45deg); opacity: 0.7; }
            100% { transform: translateY(-280px) scale(1) rotate(-45deg); opacity: 0; }
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes twinkle {
            0%   { transform: scale(0);   opacity: 0;   }
            50%  { transform: scale(1.4); opacity: 1;   }
            100% { transform: scale(0);   opacity: 0;   }
        }
    </style>
</head>
<body>
    <h1>Ich liebe dich, Jolanda! ❤️</h1>
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            document.body.appendChild(heart);

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "100vh";
            heart.style.animationDuration = (Math.random() * 2 + 2) + "s";
            const randomColor = ["#ff4b5c", "#ff0057", "#ff7f7f", "#ff2626"];
            heart.style.backgroundColor = randomColor[Math.floor(Math.random() * randomColor.length)];

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        function createStar() {
            const star = document.createElement('div');
            star.classList.add('star');
            document.body.appendChild(star);

            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";

            const size = Math.random() * 2 + 2;
            star.style.width = size + "px";
            star.style.height = size + "px";

            setTimeout(() => {
                star.remove();
            }, 2000);
        }

        setInterval(createHeart, 300);
        setInterval(createStar, 400);
    </script>
</body>
</html>
